{# Encart « Installer l'application » : visible seulement quand l'installation est possible. #}

  <img src="{{ url_for('static', path='img/icone-192.png') }}" alt="" width="56" height="56" loading="lazy">
  <div>
    <h3>{{ titre | default("TrichoSens sur votre téléphone") }}</h3>

  </div>
</div>

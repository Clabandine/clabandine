name: Tests TrichoSens

on:
  push:
    paths: ["trichosens/**", ".github/workflows/trichosens-tests.yml"]
  pull_request:
    paths: ["trichosens/**", ".github/workflows/trichosens-tests.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trichosens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

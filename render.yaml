# Configuration d'hébergement sur Render (https://render.com).
services:
  - type: web
    name: trichosens
    runtime: python
    plan: free
    region: frankfurt
    rootDir: trichosens
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /sante
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

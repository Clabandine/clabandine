# Configuration d'hébergement sur Render (https://render.com).
services:
  - type: web
    name: trichosens
    runtime: python
    plan: free
    region: frankfurt
    rootDir: trichosens
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /sante
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Clé de l'API Anthropic pour l'analyse photo : à saisir dans le tableau de bord Render.
      # Sans elle, le site fonctionne mais l'étape photo est masquée.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Nombre maximal d'analyses photo (chaque analyse coûte quelques centimes).
      - key: PHOTO_MAX_PAR_HEURE
        value: "5"
      - key: PHOTO_MAX_PAR_JOUR
        value: "200"
